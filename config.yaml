polymarket:
  host: "https://clob.polymarket.com"
  chain_id: 137

strategy:
  spread: 0.04
  order_size: 50
  num_levels: 3
  refresh_interval: 10
  skew_factor: 0.5

risk:
  max_position_per_market: 500
  max_total_exposure: 5000
  max_loss_per_market: 100
  min_time_to_resolution_days: 7

market_selection:
  min_volume_24h: 10000
  min_spread: 0.02
  max_markets: 5

circuit_breaker:
  max_change_pct: 10.0              # Trip if price changes more than 10% in check window
  check_window_seconds: 60          # Window to measure price change
  ma_window_seconds: 300            # Moving average window (5 min)
  recovery_volatility_threshold: 0.005  # Resume when volatility drops below this
  recovery_window_seconds: 120      # Window to measure recovery stability

telegram:
  pnl_interval: 300
  heartbeat_interval: 300

dry_run: true
